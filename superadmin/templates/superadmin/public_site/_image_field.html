<div class="rounded-xl border border-slate-200 bg-slate-50 p-4"><p class="form-label">{{ label }}</p>{% if image %}<img src="{{ image.url }}" alt="{{ label }}" class="mb-3 h-36 w-full rounded-lg bg-white object-cover"><label class="mb-3 flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" name="remove_{{ field_name }}"> Supprimer l’image actuelle</label>{% else %}<div class="mb-3 flex h-36 items-center justify-center rounded-lg border border-dashed border-slate-300 bg-white text-sm text-slate-400">Aucune image</div>{% endif %}<input type="file" name="{{ field_name }}" accept="image/jpeg,image/png,image/webp" class="form-input"><p class="form-help">JPG, PNG ou WebP · 5 Mo max.</p></div>
