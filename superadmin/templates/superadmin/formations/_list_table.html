{% for formation in formations %}
<tr>
    <td><strong>{{ formation.title }}</strong></td>
    <td>{{ formation.cycle.name|default:"—" }}</td>
    <td>{{ formation.duration_years }} an{{ formation.duration_years|pluralize }}</td>
    <td>
        {% if formation.is_active %}
            <span class="badge-status badge-success">Actif</span>
        {% else %}
            <span class="badge-status badge-draft">Inactif</span>
        {% endif %}
    </td>
    <td class="text-right">
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
            <a href="{% url 'superadmin:formation_edit' formation.id %}" class="btn btn-sm btn-outline">
                <i class="fas fa-edit"></i>
            </a>
            <button class="btn btn-sm btn-secondary" onclick="toggleFormation({{ formation.id }})">
                <i class="fas fa-sync"></i>
            </button>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="5" style="text-align: center; padding: 2rem; color: #94a3b8;">
        <i class="fas fa-inbox" style="font-size: 2rem; margin-bottom: 0.5rem; display: block;"></i>
        Aucune formation trouvée
    </td>
</tr>
{% endfor %}
