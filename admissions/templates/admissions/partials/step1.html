<div class="tunnel-step-shell" x-data="{ phase: revealStepOneIdentify ? 'identify' : 'welcome' }" x-effect="if (revealStepOneIdentify) phase = 'identify'">
  <div x-show="phase === 'welcome'"
       x-cloak
       x-transition:enter="transition duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
       x-transition:enter-start="opacity-0 translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition duration-200 ease-in-out"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-1"
       class="h-full min-h-0 flex flex-col">
    <div class="tunnel-scroll pr-1 space-y-6 md:space-y-5">
      <p class="text-xs uppercase tracking-[0.3em] text-ufhob-secondary-dark font-semibold">
        Admission UFHOB
      </p>

      <h2 class="text-2xl md:text-3xl lg:text-4xl xl:text-5xl font-extrabold leading-tight text-ufhob-primary">
        Bienvenue à l’UFHOB.
        <span class="block text-slate-700">Préparez votre candidature universitaire.</span>
      </h2>

      <div class="flex flex-col items-start gap-3">
        <button type="button"
                class="group inline-flex items-center gap-2 text-ufhob-primary text-base font-semibold transition hover:text-ufhob-secondary-dark"
                @click="phase = 'identify'; revealStepOneIdentify = true">
          Commencer ma candidature
          <i class="fa-solid fa-chevron-right text-xs transition-transform group-hover:translate-x-1"></i>
        </button>

      </div>
    </div>
  </div>

  <div x-show="phase === 'identify'"
       x-cloak
       x-transition:enter="transition duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
       x-transition:enter-start="opacity-0 translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition duration-200 ease-in-out"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-1"
       class="h-full min-h-0 flex flex-col">
    <div class="tunnel-scroll pr-1 space-y-6 md:space-y-5">
      <div class="space-y-3">
        <p class="text-xs uppercase tracking-[0.26em] text-ufhob-secondary-dark font-semibold">
          Identification
        </p>
        <h2 class="text-3xl md:text-4xl lg:text-5xl xl:text-6xl font-extrabold leading-[0.95] text-ufhob-primary">
          Faisons connaissance.
        </h2>
        <p class="text-sm text-slate-600">
          Pour mieux vous accompagner, comment devons-nous vous appeler ?
        </p>
      </div>

      <div class="space-y-5 max-w-2xl">
        <label class="relative block">
          <input x-model="formData.last_name" type="text" placeholder=" " data-field="last_name"
                 class="peer h-12 md:h-14 w-full border-0 border-b border-slate-300 bg-transparent pr-10 pl-0 text-base md:text-lg text-slate-900 focus:border-ufhob-secondary focus:outline-none focus:ring-0"
                 :class="errors.last_name ? '!border-red-500' : ''" />
          <span class="pointer-events-none absolute left-0 transition-all duration-300"
                :class="fieldLabelClasses(formData.last_name)">Nom</span>
          <i class="fa-regular fa-user absolute right-1 top-5 text-slate-400 text-sm"></i>
          <p x-show="errors.last_name" x-cloak class="mt-1 text-xs text-red-600" x-text="errors.last_name"></p>
        </label>

        <label class="relative block">
          <input x-model="formData.first_name" type="text" placeholder=" " data-field="first_name"
                 class="peer h-12 md:h-14 w-full border-0 border-b border-slate-300 bg-transparent pr-10 pl-0 text-base md:text-lg text-slate-900 focus:border-ufhob-secondary focus:outline-none focus:ring-0"
                 :class="errors.first_name ? '!border-red-500' : ''" />
          <span class="pointer-events-none absolute left-0 transition-all duration-300"
                :class="fieldLabelClasses(formData.first_name)">Prénom</span>
          <i class="fa-regular fa-user absolute right-1 top-5 text-slate-400 text-sm"></i>
          <p x-show="errors.first_name" x-cloak class="mt-1 text-xs text-red-600" x-text="errors.first_name"></p>
        </label>

        <label class="relative block">
          <input x-model="formData.city" type="text" placeholder=" " data-field="city"
                 class="peer h-12 md:h-14 w-full border-0 border-b border-slate-300 bg-transparent pr-10 pl-0 text-base md:text-lg text-slate-900 focus:border-ufhob-secondary focus:outline-none focus:ring-0"
                 :class="errors.city ? '!border-red-500' : ''" />
          <span class="pointer-events-none absolute left-0 transition-all duration-300"
                :class="fieldLabelClasses(formData.city)">Ville d'origine</span>
          <i class="fa-solid fa-location-dot absolute right-1 top-5 text-slate-400 text-sm"></i>
          <p x-show="errors.city" x-cloak class="mt-1 text-xs text-red-600" x-text="errors.city"></p>
        </label>
      </div>
    </div>

    <div class="tunnel-nav">
      <button type="button"
              class="group tunnel-btn-next"
              :disabled="!isStepComplete(1)"
              :class="!isStepComplete(1) ? 'opacity-60 cursor-not-allowed' : ''"
              @click="goTo(2)">
        Suivant
        <i class="fa-solid fa-chevron-right text-xs transition-transform group-hover:translate-x-1"></i>
      </button>
    </div>
  </div>
</div>
