<div class="tunnel-step-shell" x-data="{ phase: (revealStepOneIdentify || formData.formation_slug) ? 'identify' : 'welcome' }" x-effect="if (revealStepOneIdentify || formData.formation_slug) phase = 'identify'">
  <div x-show="phase === 'welcome'"
       x-cloak
       x-transition:enter="transition duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
       x-transition:enter-start="opacity-0 translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition duration-200 ease-in-out"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-1"
       class="h-full min-h-0 flex flex-col">
    <div class="tunnel-scroll">
      <p class="text-xs uppercase tracking-[0.3em] text-ufhob-secondary-dark font-semibold">
        Admission UFHOB-Mali
      </p>

      <h2 class="text-2xl md:text-3xl lg:text-4xl xl:text-5xl font-extrabold leading-tight text-ufhob-primary">
        Bienvenue à l’UFHOB-Mali.
        <span class="block text-slate-700">Préparez votre candidature universitaire.</span>
      </h2>

      <div class="flex flex-col items-start gap-3">
        <button type="button"
                class="group inline-flex items-center gap-2 text-ufhob-primary text-base font-semibold transition hover:text-ufhob-secondary-dark"
                @click="phase = 'identify'; revealStepOneIdentify = true">
          Commencer ma candidature
          <i class="fa-solid fa-chevron-right text-xs transition-transform group-hover:translate-x-1"></i>
        </button>

      </div>
    </div>
  </div>

  <div x-show="phase === 'identify'"
       x-cloak
       x-transition:enter="transition duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
       x-transition:enter-start="opacity-0 translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition duration-200 ease-in-out"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-1"
       class="h-full min-h-0 flex flex-col">
    <div class="tunnel-scroll">
      <div class="tunnel-step-heading"><h2>Faisons connaissance</h2><p>Comment devons-nous vous appeler ?</p></div>
<label class="tunnel-field"><span>Nom</span><input x-model="formData.last_name" type="text" placeholder="Ex. Traoré" data-field="last_name" :class="errors.last_name ? 'field-invalid' : ''" :aria-invalid="Boolean(errors.last_name)"><p x-show="errors.last_name" x-cloak class="tunnel-field-error" x-text="errors.last_name"></p></label>
<label class="tunnel-field"><span>Prénom</span><input x-model="formData.first_name" type="text" placeholder="Ex. Aminata" data-field="first_name" :class="errors.first_name ? 'field-invalid' : ''" :aria-invalid="Boolean(errors.first_name)"><p x-show="errors.first_name" x-cloak class="tunnel-field-error" x-text="errors.first_name"></p></label>
<label class="tunnel-field"><span>Ville d'origine</span><input x-model="formData.city" type="text" placeholder="Ex. Bamako" data-field="city" :class="errors.city ? 'field-invalid' : ''" :aria-invalid="Boolean(errors.city)"><p x-show="errors.city" x-cloak class="tunnel-field-error" x-text="errors.city"></p></label>
    </div>

    <div class="tunnel-reassurance"><i class="fa-solid fa-lock" aria-hidden="true"></i> Vos données restent confidentielles.<br>Aucun document demandé à cette étape.</div>
<div class="tunnel-nav">
      <button type="button"
              class="group tunnel-btn-next"
              :disabled="!isStepComplete(1)"
              :class="!isStepComplete(1) ? 'opacity-60 cursor-not-allowed' : ''"
              @click="goTo(2)">
        Suivant
        <i class="fa-solid fa-chevron-right text-xs transition-transform group-hover:translate-x-1"></i>
      </button>
    </div>
  </div>
</div>
