<div class="tunnel-step-shell">
  <div class="tunnel-scroll pr-1">
    <div class="tunnel-step-heading"><h2>Vos coordonnées</h2><p>Renseignez vos informations de contact et votre profil.</p></div>

    <fieldset class="mt-5 max-w-2xl" data-field="gender">
      <legend class="text-sm font-semibold text-ufhob-primary">Genre</legend>
      <div class="mt-2 grid grid-cols-2 gap-3">
        <button type="button"
                class="rounded-xl border px-4 py-3 text-sm font-semibold transition"
                :class="formData.gender === 'female' ? 'border-ufhob-secondary bg-ufhob-primary-soft/10 text-ufhob-primary ring-1 ring-ufhob-secondary/35' : (errors.gender ? 'border-red-400' : 'border-slate-200 text-slate-700 hover:border-ufhob-secondary/60')"
                @click="formData.gender='female'; delete errors.gender">
          Féminin
        </button>
        <button type="button"
                class="rounded-xl border px-4 py-3 text-sm font-semibold transition"
                :class="formData.gender === 'male' ? 'border-ufhob-secondary bg-ufhob-primary-soft/10 text-ufhob-primary ring-1 ring-ufhob-secondary/35' : (errors.gender ? 'border-red-400' : 'border-slate-200 text-slate-700 hover:border-ufhob-secondary/60')"
                @click="formData.gender='male'; delete errors.gender">
          Masculin
        </button>
      </div>
      <p x-show="errors.gender" x-cloak class="mt-2 text-xs text-red-600" x-text="errors.gender"></p>
    </fieldset>

<label class="tunnel-field"><span>Email</span><input x-model="formData.email" type="email" placeholder="Ex. aminata@exemple.com" data-field="email" :class="errors.email ? 'field-invalid' : ''" :aria-invalid="Boolean(errors.email)"><p x-show="errors.email" x-cloak class="tunnel-field-error" x-text="errors.email"></p></label>
<label class="tunnel-field"><span>Téléphone</span><input x-model="formData.phone" type="text" placeholder="Ex. +223 76 88 24 79" data-field="phone" :class="errors.phone ? 'field-invalid' : ''" :aria-invalid="Boolean(errors.phone)"><p x-show="errors.phone" x-cloak class="tunnel-field-error" x-text="errors.phone"></p></label>
<label class="tunnel-field"><span>Date de naissance</span><input x-model="formData.birth_date" type="date" placeholder="" data-field="birth_date" :class="errors.birth_date ? 'field-invalid' : ''" :aria-invalid="Boolean(errors.birth_date)"><p x-show="errors.birth_date" x-cloak class="tunnel-field-error" x-text="errors.birth_date"></p></label>
  </div>

  <div class="tunnel-reassurance"><i class="fa-solid fa-lock" aria-hidden="true"></i> Vos données restent confidentielles.<br>Aucun document demandé à cette étape.</div>
<div class="tunnel-nav">
    <button type="button"
            class="tunnel-btn-prev"
            @click="goTo(1)">
      Retour
    </button>
    <button type="button"
            class="group tunnel-btn-next"
            :disabled="!isStepComplete(2)"
            :class="!isStepComplete(2) ? 'opacity-60 cursor-not-allowed' : ''"
            @click="goTo(3)">
      Suivant
      <i class="fa-solid fa-chevron-right text-xs transition-transform group-hover:translate-x-1"></i>
    </button>
  </div>
</div>
