<div class="space-y-1.5 {% if is_wide %}md:col-span-2{% endif %}" data-ui-core="form-field" data-ui-form-state="{% if has_errors %}error{% else %}default{% endif %}">
  {% if is_checkbox %}
    <label for="{{ field_id }}" class="flex min-h-ui-control items-center gap-3 rounded-ui-input border {% if has_errors %}border-ui-danger bg-ui-danger-soft{% else %}border-ui-border bg-ui-surface hover:bg-ui-surface-hover{% endif %} px-3 text-sm font-semibold text-ui-text">
      {{ rendered_field }}
      <span>{{ field.label }}{% if field.field.required %}<span class="text-ui-danger" aria-hidden="true"> *</span>{% endif %}</span>
    </label>
  {% else %}
    <label for="{{ field_id }}" class="block text-sm font-semibold text-ui-text">{{ field.label }}{% if field.field.required %}<span class="text-ui-danger" aria-hidden="true"> *</span>{% endif %}</label>
    <div class="[&_input]:h-ui-control [&_input]:w-full [&_input]:rounded-ui-input [&_input]:border [&_input]:{% if has_errors %}border-ui-danger [&_input]:focus:border-ui-danger [&_input]:focus:ring-ui-danger{% else %}border-ui-border [&_input]:focus:border-ui-focus [&_input]:focus:ring-ui-focus{% endif %} [&_input]:bg-ui-surface [&_input]:px-3 [&_input]:text-sm [&_input]:text-ui-text [&_input:disabled]:cursor-not-allowed [&_input:disabled]:bg-ui-surface-muted [&_select]:h-ui-control [&_select]:w-full [&_select]:rounded-ui-input [&_select]:border [&_select]:{% if has_errors %}border-ui-danger [&_select]:focus:border-ui-danger [&_select]:focus:ring-ui-danger{% else %}border-ui-border [&_select]:focus:border-ui-focus [&_select]:focus:ring-ui-focus{% endif %} [&_select]:bg-ui-surface [&_select]:px-3 [&_select]:text-sm [&_select]:text-ui-text [&_select:disabled]:cursor-not-allowed [&_select:disabled]:bg-ui-surface-muted [&_textarea]:min-h-24 [&_textarea]:w-full [&_textarea]:rounded-ui-input [&_textarea]:border [&_textarea]:{% if has_errors %}border-ui-danger [&_textarea]:focus:border-ui-danger [&_textarea]:focus:ring-ui-danger{% else %}border-ui-border [&_textarea]:focus:border-ui-focus [&_textarea]:focus:ring-ui-focus{% endif %} [&_textarea]:bg-ui-surface [&_textarea]:px-3 [&_textarea]:py-2 [&_textarea]:text-sm [&_textarea]:text-ui-text [&_textarea:disabled]:cursor-not-allowed [&_textarea:disabled]:bg-ui-surface-muted">
      {% if is_percentage %}
        <div class="relative [&_input]:pr-10">
          {{ rendered_field }}
          <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm font-bold text-ui-text-muted">%</span>
        </div>
      {% else %}
        {{ rendered_field }}
      {% endif %}
    </div>
  {% endif %}
  {% if field.help_text %}<p id="{{ field_id }}-help" class="text-xs text-ui-text-muted">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<ul id="{{ field_id }}-errors" class="space-y-1 text-xs font-semibold text-ui-danger" role="alert">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
