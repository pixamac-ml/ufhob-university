{% load component_tags %}
<section class="flex min-h-0 min-w-0 flex-col overflow-hidden bg-ui-surface {% if fullscreen %}h-full w-full{% else %}rounded-ui-card border border-ui-border shadow-ui-card{% endif %}" data-ui-core="course-workspace">
  <header class="shrink-0 border-b border-ui-border p-4">
    <div class="flex min-w-0 items-start justify-between gap-3"><div class="min-w-0"><h2 class="truncate text-lg font-bold text-ui-text">{{ title }}</h2>{% if subtitle %}<p class="mt-1 truncate text-sm text-ui-text-muted">{{ subtitle }}</p>{% endif %}</div>{% slot "header_actions" %}{% endslot %}</div>
    {% slot "header" %}{% endslot %}
  </header>
  <div class="grid min-h-0 min-w-0 flex-1 lg:grid-cols-[minmax(0,1fr)_minmax(20rem,24rem)]"{% if collapsible %} :class="tocCollapsed ? 'lg:grid-cols-1' : 'lg:grid-cols-[minmax(0,1fr)_minmax(20rem,24rem)]'"{% endif %}>
    <main class="order-1 min-h-0 min-w-0 overflow-y-auto">
      <div class="border-b border-ui-border p-3 lg:hidden">{% slot "mobile_navigation" %}{% endslot %}</div>
      {% slot "default" %}{% endslot %}
    </main>
    <aside class="order-2 hidden min-h-0 overflow-y-auto border-l border-ui-border bg-ui-surface-soft lg:block"{% if collapsible %} x-show="!tocCollapsed" x-cloak{% endif %}>
      {% slot "sidebar" %}{% endslot %}
    </aside>
  </div>
</section>
