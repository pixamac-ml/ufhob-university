{% load component_tags %}
<section class="flex h-full min-h-0 min-w-0 w-full flex-col overflow-hidden bg-ui-surface" data-ui-core="course-player">
  <header class="shrink-0 border-b border-ui-border bg-ui-surface px-4 py-3 sm:px-5">
    <div class="flex min-w-0 items-start justify-between gap-3"><div class="min-w-0"><h1 class="truncate text-lg font-bold text-ui-text">{{ title }}</h1>{% if subtitle %}<p class="mt-1 truncate text-sm text-ui-text-muted">{{ subtitle }}</p>{% endif %}</div>{% slot "header_actions" %}{% endslot %}</div>
    {% slot "header" %}{% endslot %}
  </header>
  <div class="grid min-h-0 min-w-0 flex-1 lg:grid-cols-[minmax(0,1fr)_minmax(20rem,24rem)]" {% if collapsible %}:class="tocCollapsed ? 'lg:grid-cols-1' : 'lg:grid-cols-[minmax(0,1fr)_minmax(20rem,24rem)]'"{% endif %}>
    <main class="order-1 min-h-0 min-w-0 overflow-y-auto"><div class="border-b border-ui-border p-3 lg:hidden">{% slot "mobile_navigation" %}{% endslot %}</div>{% slot "default" %}{% endslot %}</main>
    <aside class="order-2 hidden min-h-0 overflow-y-auto border-l border-ui-border bg-ui-surface-soft lg:block" {% if collapsible %}x-show="!tocCollapsed" x-cloak{% endif %}>{% slot "sidebar" %}{% endslot %}</aside>
  </div>
</section>
