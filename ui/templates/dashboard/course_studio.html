{% load component_tags %}
<section class="flex h-full min-h-0 w-full flex-col overflow-hidden bg-ui-surface" data-ui-core="course-studio">
  <header class="flex min-h-16 shrink-0 items-center justify-between gap-4 border-b border-ui-border bg-ui-surface px-4 sm:px-6">
    <div class="flex min-w-0 items-center gap-3"><button type="button" data-teacher-course-studio-close class="ui-focus-ring inline-flex min-h-10 shrink-0 items-center gap-2 rounded-ui-button border border-ui-border px-3 text-sm font-semibold text-ui-text hover:bg-ui-surface-hover"><i data-lucide="arrow-left" class="h-4 w-4"></i><span class="hidden sm:inline">Retour aux cours</span></button><div class="min-w-0 border-l border-ui-border pl-3"><p class="truncate text-sm font-bold text-ui-text">{{ title }}</p>{% if subtitle %}<p class="truncate text-xs text-ui-text-muted">{{ subtitle }}</p>{% endif %}</div></div>
    <div class="hidden shrink-0 items-center gap-2 text-xs font-semibold text-ui-text-muted sm:flex"><i data-lucide="file-pen-line" class="h-4 w-4 text-ui-primary"></i>Course Studio</div>
  </header>
  <main class="min-h-0 flex-1 overflow-y-auto bg-ui-surface-muted p-4 sm:p-5 lg:p-6">{% slot "default" %}{% endslot %}</main>
</section>
