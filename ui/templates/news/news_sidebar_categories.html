<div class="news-detail-aside-card">

    <h3 class="text-xs font-bold uppercase tracking-[0.18em] text-ufhob-primary mb-6 flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-ufhob-secondary-dark"></i>
        Catégories
    </h3>

    <ul class="space-y-3 text-sm">
        <li>
            <a
                hx-get="{% url 'news:list' %}?{% if current_search %}q={{ current_search|urlencode }}&{% endif %}"
                hx-target="#news-content"
                hx-swap="outerHTML"
                hx-push-url="true"
                hx-indicator="#news-loading"
                class="block border-l-2 px-3 py-2 transition {% if not current_category %}border-ufhob-secondary bg-ufhob-primary-soft font-bold text-ufhob-primary{% else %}border-transparent text-ufhob-muted hover:border-ufhob-secondary hover:bg-ufhob-primary-soft hover:text-ufhob-primary{% endif %}">
                <i class="fa-regular fa-newspaper mr-2"></i>
                Toutes les actualités
            </a>
        </li>
        {% for cat in categories %}
        <li>
            <a
                hx-get="{% url 'news:list' %}?category={{ cat.slug }}{% if current_search %}&q={{ current_search|urlencode }}{% endif %}"
                hx-target="#news-content"
                hx-swap="outerHTML"
                hx-push-url="true"
                hx-indicator="#news-loading"
                class="block border-l-2 px-3 py-2 transition
                {% if current_category == cat.slug %}
                    border-ufhob-secondary bg-ufhob-primary-soft font-bold text-ufhob-primary
                {% else %}
                    border-transparent text-ufhob-muted hover:border-ufhob-secondary hover:bg-ufhob-primary-soft hover:text-ufhob-primary
                {% endif %}">
                <i class="fa-solid fa-tag mr-2 text-primary-400"></i>
                {{ cat.nom }}
            </a>
        </li>
        {% endfor %}
    </ul>

</div>
