<div class="max-w-3xl {{ align|default:'text-left' }}">
  {% if eyebrow %}<p class="text-xs font-bold uppercase tracking-[0.2em] text-ufhob-secondary-dark">{{ eyebrow }}</p>{% endif %}
  <h2 class="mt-3 text-3xl font-bold leading-tight text-ufhob-primary sm:text-4xl">{{ title }}</h2>
  {% if text %}<p class="mt-4 text-base leading-7 text-ufhob-muted sm:text-lg">{{ text }}</p>{% endif %}
</div>
