<div class="rounded-ufhob-lg border border-dashed border-ufhob-border bg-white p-8 text-center">
  <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-ufhob-primary-soft text-ufhob-primary" aria-hidden="true"><i class="fa-solid fa-circle-info"></i></span>
  <h3 class="mt-4 font-bold text-ufhob-primary">{{ title|default:"Aucun contenu disponible" }}</h3>
  {% if text %}<p class="mx-auto mt-2 max-w-xl text-sm leading-6 text-ufhob-muted">{{ text }}</p>{% endif %}
</div>
