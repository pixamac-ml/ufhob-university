{% load static %}
<section class="relative isolate overflow-hidden border-b-4 border-ufhob-accent bg-ufhob-primary py-16 text-white sm:py-20">
  {% if image_url %}<img src="{{ image_url }}" alt="" class="absolute inset-0 -z-20 h-full w-full object-cover">{% endif %}
  <div class="absolute inset-0 -z-10 bg-ufhob-primary/90"></div>
  <div class="mx-auto max-w-ufhob-container px-4 sm:px-6 lg:px-8">
    {% if back_url %}<a href="{{ back_url }}" class="mb-7 inline-flex items-center gap-2 text-sm font-semibold text-white/70 hover:text-white">← {{ back_label|default:"Retour" }}</a>{% endif %}
    <p class="public-section-mark text-xs font-bold uppercase tracking-[0.2em] text-white/80">{{ eyebrow|default:"UFHOB" }}</p>
    <h1 class="mt-3 max-w-4xl text-3xl font-bold leading-tight text-white sm:text-4xl lg:text-5xl">{{ title }}</h1>
    {% if text %}<p class="mt-5 max-w-3xl text-base leading-7 text-white/75 sm:text-lg">{{ text }}</p>{% endif %}
    {% if slot %}<div class="mt-8">{{ slot }}</div>{% endif %}
  </div>
</section>
