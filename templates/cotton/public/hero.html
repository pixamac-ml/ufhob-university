{% load static %}
<section id="hero-section" class="relative isolate min-h-[620px] overflow-hidden bg-ufhob-primary text-white lg:min-h-[680px]">
  <div class="absolute inset-0">
    <img src="{% if image_url %}{{ image_url }}{% else %}{% static 'images/hero-bg.jpg' %}{% endif %}" alt="Campus de l’UFHOB-Mali" class="h-full w-full object-cover object-center" width="1200" height="800" loading="lazy">
    <div class="absolute inset-0 bg-gradient-to-r from-ufhob-primary via-ufhob-primary/95 to-ufhob-primary/35"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-ufhob-primary/80 via-transparent to-transparent"></div>
  </div>
  <div class="relative mx-auto flex min-h-[620px] max-w-ufhob-container items-center px-4 py-20 sm:px-6 lg:min-h-[680px] lg:px-8">
    <div class="max-w-3xl">
      <span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/10 px-4 py-2 text-xs font-bold uppercase tracking-[0.2em] backdrop-blur">Université privée · Mali</span>
      <h1 class="mt-6 break-words text-3xl font-bold leading-[1.1] text-white sm:text-5xl lg:text-6xl">{{ title|default:public_brand_name }}</h1>
      <p class="mt-6 max-w-2xl text-lg leading-8 text-white/85 sm:text-xl">{{ subtitle|default:"Une université d’excellence académique, d’innovation scientifique et d’engagement citoyen." }}</p>
      <p class="mt-4 font-semibold uppercase tracking-[0.22em] text-ufhob-secondary">Demain, c’est aujourd’hui</p>
      <div class="mt-8 flex flex-col gap-3 sm:flex-row">
        <a href="{% url 'admissions:admission_tunnel' %}" class="inline-flex items-center justify-center rounded-ufhob-sm bg-ufhob-accent px-6 py-3.5 font-bold text-ufhob-primary shadow-premium hover:brightness-105">Candidater</a>
        <a href="#schools" class="inline-flex items-center justify-center rounded-ufhob-sm border border-white/30 bg-white/10 px-6 py-3.5 font-semibold text-white backdrop-blur hover:bg-white/20">Découvrir nos écoles</a>
      </div>
    </div>
  </div>
</section>
