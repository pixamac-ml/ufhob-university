<div>
  <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-bold text-ufhob-primary">{{ field.label }}{% if field.field.required %} <span class="text-red-600">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1.5 text-xs text-ufhob-muted">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div class="mt-1.5 text-xs font-medium text-red-600">{{ field.errors }}</div>{% endif %}
</div>
