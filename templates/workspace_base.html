{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"historyCacheSize": 0}'>
  <title>{% block title %}UFHOB{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'app/css/main.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/esfe_theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/app/tokens.css' %}">
  <style>[x-cloak]{display:none!important}</style>
  <script defer src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpinejs/alpine-intersect.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpinejs/alpine.min.js' %}"></script>
  <script defer src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
  <script defer src="{% static 'src/js/ui_core/index.js' %}"></script>
  {% block extra_head %}{% endblock %}
</head>
<body data-app-shell class="min-h-screen overflow-x-clip bg-ui-surface-muted font-roboto text-ui-text antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% include "toast.html" %}
  {% block content %}{% endblock %}
  <script>
    document.addEventListener("DOMContentLoaded", () => { if (window.lucide) window.lucide.createIcons(); });
    document.body.addEventListener("htmx:afterSwap", (event) => { if (window.lucide) window.lucide.createIcons(); });
    document.body.addEventListener("htmx:beforeSwap", (event) => {
      const target = event.detail.target;
      if (!target || !window.editors) return;
      target.querySelectorAll?.("textarea.django_ckeditor_5").forEach((textarea) => {
        const editor = window.editors[textarea.id];
        if (!editor) return;
        // The replacement editor uses the same field id. Remove this stale
        // reference before asynchronous destruction can finish.
        delete window.editors[textarea.id];
        editor.destroy().catch(() => {});
      });
    });
    document.body.addEventListener("account:profile-updated", (event) => {
      const avatarUrl = event.detail && event.detail.avatar_url;
      if (!avatarUrl) return;
      const cacheBusted = avatarUrl + (avatarUrl.includes("?") ? "&" : "?") + "v=" + Date.now();
      document.querySelectorAll("[data-user-avatar]").forEach((avatar) => { avatar.src = cacheBusted; });
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
