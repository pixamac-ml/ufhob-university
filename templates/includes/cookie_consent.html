{% url 'core:cookie_consent' as cookie_consent_url %}

<div id="cookie-consent-root"
     data-endpoint="{{ cookie_consent_url }}"
     data-csrf-token="{{ csrf_token }}"
     data-consent-version="{{ cookie_consent_version }}"
     data-consent-max-age="{{ cookie_consent_max_age }}"
     class="fixed inset-x-0 bottom-0 z-[95] pointer-events-none">
  <section id="cookie-banner"
           class="hidden pointer-events-auto mx-auto max-w-5xl p-4 sm:p-6"
           aria-labelledby="cookie-consent-title"
           aria-describedby="cookie-consent-description">
    <div class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-2xl ring-1 ring-slate-900/5 sm:p-6">
      <div class="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
        <div class="flex max-w-3xl items-start gap-3">
          <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-primary-50 text-primary-700" aria-hidden="true">
            <i class="fa-solid fa-shield-halved"></i>
          </span>
          <div>
            <h2 id="cookie-consent-title" class="text-base font-semibold text-slate-900 sm:text-lg">Vos préférences cookies</h2>
            <p id="cookie-consent-description" class="mt-1 text-sm leading-6 text-slate-600">
              ESFE utilise uniquement des cookies nécessaires à la sécurité, à la connexion et au bon fonctionnement du site.
              Votre choix est mémorisé pour ne pas vous redemander à chaque visite.
            </p>
          </div>
        </div>

        <div class="grid shrink-0 gap-2 sm:grid-cols-2">
          <button id="cookie-reject-all" type="button" class="btn btn-outline btn-sm justify-center">Refuser</button>
          <button id="cookie-accept-all" type="button" class="btn btn-primary btn-sm justify-center">Accepter</button>
        </div>
      </div>
    </div>
  </section>
</div>
