{% load humanize %}
<section class="rounded-ui-card border border-ui-success bg-ui-success-soft p-5 text-center">
  <i data-lucide="circle-check-big" class="mx-auto h-9 w-9 text-ui-success"></i>
  <h3 class="mt-3 text-base font-bold text-ui-text">Commande enregistree</h3>
  <p class="mt-2 text-sm text-ui-text-muted">Reference : <strong>{{ order.reference }}</strong><br>Montant : <strong>{{ order.total_amount|intcomma }} FCFA</strong></p>
  <p class="mt-3 rounded-ui-card bg-ui-warning-soft p-3 text-xs text-ui-text-muted">Statut : <strong>{{ order.get_status_display }}</strong>. Presentez cette reference a votre annexe : le paiement et le recu seront etablis seulement apres encaissement reel.</p>
  <button type="button" hx-get="{% url 'portal_student:shop_orders_partial' %}" hx-target="#student-workspace" hx-swap="innerHTML" class="ui-focus-ring mt-4 h-ui-control rounded-ui-button bg-ui-primary px-4 text-sm font-semibold text-ui-on-primary">Voir mes commandes</button>
</section>
