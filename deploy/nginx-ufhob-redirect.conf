# Exemple à intégrer manuellement dans la configuration Nginx existante.
# Ne pas remplacer le bloc HTTPS www qui sert l'application Django.
server {
    listen 80;
    listen [::]:80;
    server_name ufhob-mali.ml www.ufhob-mali.ml;
    return 301 https://www.ufhob-mali.ml$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ufhob-mali.ml;
    # Vérifier ces chemins sur le serveur avant application. Le certificat
    # doit couvrir ufhob-mali.ml et www.ufhob-mali.ml.
    ssl_certificate /etc/letsencrypt/live/ufhob-mali.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ufhob-mali.ml/privkey.pem;
    return 301 https://www.ufhob-mali.ml$request_uri;
}
